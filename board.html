<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방문간호 이야기 | 백세인생 방문간호</title>
  <meta name="description" content="집에서 이어지는 간호에 필요한 정보를 전하는 백세인생 방문간호센터의 방문간호 이야기입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260904-r5">
  <link rel="stylesheet" href="css/board.css?v=20260904-r13">
  <link rel="stylesheet" href="css/consistency.css?v=20260904-r28">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'; form-action 'self';">
</head>
<body data-page="board">
  <div id="header-placeholder"></div>

  <section class="page-header page-image-hero">
    <div class="container">
      <p class="section-tag">Story</p>
      <div class="page-header-content">
        <h1>방문간호 이야기</h1>
        <p class="page-header-desc">
          <strong>집에서 이어지는 간호에 필요한 정보를 전합니다.</strong>
        </p>
      </div>
    </div>
  </section>

  <main class="board-main">
    <section class="board-section">
      <div class="container">
        <div class="board-toolbar" aria-live="polite">
          <p class="board-summary" id="boardSummary">게시글을 불러오는 중입니다.</p>
        </div>
        <div class="board-table-wrap">
          <table class="board-table">
            <thead>
              <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">작성일</th>
              </tr>
            </thead>
            <tbody id="boardList" data-reveal-group></tbody>
          </table>
        </div>
        <nav id="boardPagination" class="board-pagination" aria-label="페이지 네비게이션"></nav>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="js/board-data.js"></script>
  <script src="js/board.js?v=20260904-r7"></script>
  <script src="js/main.js?v=20260904-r20"></script>
</body>
</html>
